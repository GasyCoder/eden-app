<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#13692C">
    <title>Hors ligne | EDEN</title>
    <style>
        :root { color-scheme: light dark; --bg: #fff; --fg: #101412; --muted: #5f6a63; --line: #e3e8e4; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0b0f0c; --fg: #ecf0ed; --muted: #9ba69f; --line: #222c25; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
        main { width: 100%; max-width: 380px; text-align: center; }
        .stripe { display: flex; height: 4px; width: 96px; margin: 0 auto 28px; border-radius: 99px; overflow: hidden; }
        .stripe span:nth-child(1) { flex: 3; background: #13692c; } .stripe span:nth-child(2) { flex: 1; background: #d3a20a; } .stripe span:nth-child(3) { flex: 1; background: #aa0504; }
        img { width: 56px; height: 56px; border-radius: 12px; }
        h1 { margin: 20px 0 8px; font-size: 22px; letter-spacing: -0.01em; }
        p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 15px; }
        .actions { display: grid; gap: 10px; margin-top: 28px; }
        button, a { display: inline-flex; align-items: center; justify-content: center; height: 44px; border-radius: 8px; font: 600 15px/1 inherit; font-family: inherit; text-decoration: none; cursor: pointer; }
        button { border: 0; background: #13692c; color: #fff; }
        a { border: 1px solid var(--line); color: var(--fg); }
    </style>
</head>
<body>
    <main>
        <div class="stripe" aria-hidden="true"><span></span><span></span><span></span></div>
        <img src="/pwa/icon-192.png" alt="">
        <h1>Vous êtes hors ligne</h1>
        <p>Cette page n’a pas encore été consultée sur cet appareil. Les pages déjà ouvertes restent disponibles sans connexion.</p>
        <div class="actions">
            <button type="button" onclick="location.reload()">Réessayer</button>
            <a href="/">Retour à l’accueil</a>
        </div>
    </main>
    <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
